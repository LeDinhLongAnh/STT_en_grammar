; ==========================================================================
;  Contextual-biasing STT - runtime configuration
;
;  Simple key = value. ';' or '#' starts a comment. Sections are namespaces:
;  a key in [asr] is addressed as "asr.num_threads". Every value can be
;  overridden on the command line:
;      vcc_cli --set asr.hotwords_score=3.0 --set asr.num_threads=3
; ==========================================================================

[paths]
models_dir = models
hotwords   = config/hotwords.txt
rewrites   = config/rewrites.txt

[filter]
; The two stages of the filter, independently switchable so their individual
; contribution is measurable. Turning both off makes the "filtered" output
; identical to the raw one, which is a useful sanity check.
;
; stage 1: contextual biasing inside the decoder
biasing  = true
; stage 2: rewrite rules over the resulting text
rewrites = true

[asr]
; Model id = directory name under models/. Empty -> the best biasing-capable
; model the registry can find: biasable, int8, non-streaming, smallest.
;
; Naming a streaming model here DOES work -- it loads under sherpa-onnx's online
; recogniser and biases the same way -- but it is a comparison, not a deployment:
; the only English export is 128 MB int8 against a 200 MB whole-system budget,
; and a chunked encoder gives up the right context that accented speech needs
; most. The registry will never select one on its own.
model            =
; int8 | fp32 | auto  (auto prefers int8 - that is what we ship for the A55)
precision        = auto
; A55 x4 -> 3 leaves one core for the rest of the router. 4 is fine on a desktop.
num_threads      = 4

; ONLY modified_beam_search honours hotwords. greedy_search silently ignores
; them, which would make the whole feature a no-op; the engine says so at load
; time rather than letting you discover it from identical transcripts.
decoding_method  = modified_beam_search
max_active_paths = 4

; THE boost. One value for the entire hotword list -- config/hotwords.txt has no
; per-phrase score, on purpose: a per-phrase knob is a per-phrase decision, and
; thirty of those cannot be tuned well. One number can be swept in an afternoon.
;
; This is the single most important number in the project. Too low and biasing
; does nothing; too high and the decoder starts hallucinating your vocabulary
; out of noise, which is worse than not biasing at all.
;
; IT DOES NOT TRANSFER BETWEEN MODELS. Biasing "YELLOW LAMBS" against a clip
; that says "yellow lamps":
;   zipformer-small-en  flips between 2.0 and 3.0
;   zipformer-en        never flips, even at 12.0
; Biasing is not broken on the second one - other phrases bend it at 4.0. A more
; accurate acoustic model is simply more confident, so the same boost buys less,
; and the resistance is per-word too.
;
; So: re-sweep after changing model, against a recorded corpus:
;     for %s in (1.0 2.0 3.0 4.0) do vcc_cli --set asr.hotwords_score=%s --eval ...
hotwords_score   = 2.0

; Small negative pressure on the blank symbol. Helps recover the swallowed final
; consonants typical of Vietnamese-accented English ("gues" for "guest").
; Try 0.5-1.0 if endings keep disappearing; 0 disables.
blank_penalty    = 0.0

debug            = false

[audio]
; Capture device index as reported by `vcc_listen --list-mics`. -1 = default.
mic_index   = -1

; The rate handed to the model. 16000 is what these acoustic models were trained
; on; changing it means the features no longer line up with the weights, so
; treat this as fixed unless you have swapped in a model that wants otherwise.
;
; The WASAPI backend asks the device for 16 kHz / 16-bit / mono directly and only
; resamples if the driver refuses. Either way the samples are quantised to 16-bit
; before they leave the capture layer, so the dev-box path is bit-identical to a
; 16-bit ALSA capture on the router -- and to a clip saved as 16-bit PCM, which
; is what makes a recorded corpus decode to what you heard live.
sample_rate = 16000
; Longest single recording, in seconds. Push-to-talk has no endpointer, so this
; is the backstop against a forgotten Stop filling memory: 16 kHz mono float is
; 64 KB per second.
max_record_s = 60

[engine]
; The PyQt5 dashboard launches vcc_engine itself on a free port, so these only
; matter when you run the engine by hand.
host = 127.0.0.1
port = 8777

[log]
; trace | debug | info | warn | error
level = info
